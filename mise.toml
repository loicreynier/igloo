[settings]
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.profile" = { source = "config/shell/.profile" }
"~/.bashrc" = { source = "config/bash/.bashrc" }
"~/.config/bash/functions" = { source = "config/bash/functions" }
"~/.config/inputrc" = { source = "config/inputrc" }
"~/.config/git" = { source = "config/git" }
"~/.config/nvim" = { source = "config/nvim", exclude = ["README.md"] }
"~/.config/bat" = { source = "config/bat" }
"~/.config/ripgreprc" = { source = "config/ripgreprc" }
"~/.config/direnv" = { source = "config/direnv" }
"~/.config/mise" = { source = "config/mise" }
"~/.config/python" = { source = "config/python" }
"~/.config/tmux" = { source = "config/tmux" }
"~/.config/ghostty" = { source = "config/ghostty" }

[tools]
editorconfig-checker = "latest"
gum = "latest"
prek = "latest"
rg = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"
typos = "latest"
usage = "latest"
uv = "latest"

[tasks.todo]
description = "Show TODO's and FIXME's notes"
run = "rg --hidden --sort=path --glob='!.mise.toml' '(TODO|FIXME)(\\([a-zA-Z0-9_-]+\\))?:'"

[tasks.pre-commit]
description = "Run pre-commit checks"
quiet = true
usage = '''
flag "--nix" help="Use Nix-generated config"
flag "--all" help="Run on all files"
'''
run = '''
if [ "${usage_nix}" = "true" ]; then
  prek run -c ./.pre-commit-config-nix.yaml ${usage_all:+--all-files}
else
  prek run ${usage_all:+--all-files}
fi
'''

[tasks.git-submodules-update]
description = "Update Git submodules"
run = "git submodule update --init --recursive"
