# -- Bindings --------------------------------------------------------------------------------------

unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloading configuration..."
bind b set-option -g status #{?status,off,on}

# -- Global options --------------------------------------------------------------------------------

set -g mouse on
set -g set-titles on

# -- Status ----------------------------------------------------------------------------------------

set -g status off
set -g status-position top
set -g status-style "bg=default,fg=green"
set -g status-justify "absolute-centre"
