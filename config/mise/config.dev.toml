[settings]
minimum_release_age_excludes = ["opencode"]

[tools]
neovim = "nightly"
opencode = "latest"

# Lua/Neovim
lua-language-server = "latest"
"cargo:stylua" = "latest"
"cargo:tree-sitter-cli" = "latest"
# Shell
shellcheck = "latest"
# Python
ruff = "latest"
ty = "latest"
# Fortran
"pipx:fortls" = { version = "latest", uvx = "true" }
"pipx:fprettify" = { version = "latest", uvx = "true" }
"pipx:fortitude-lint" = { version = "latest", uvx = "true" }
"cargo:ffmt" = "latest"
# LaTeX
# tinytex = "latest"
"aqua:jolars/badness" = "latest"
# Typst
typst = "latest"
tinymist = "latest"
typstyle = "latest"
# Misc
taplo = "latest"
"cargo:https://github.com/tekumara/typos-lsp" = "latest"
"cargo:neocmakelsp" = "latest"
"npm:vscode-langservers-extracted" = "latest"
